# Clash Verge Rev 全局扩展配置 (v4, 46 groups / 381 rules)
# 与 OpenClash 03_openclash.yaml / Stash 02_stash_v4.stoverride 同源
# 用法: 订阅页顶部 -> 全局扩展配置 -> 粘贴/导入 -> 刷新
proxy-groups:
- name: 📋 全部节点
  type: select
  include-all: true
  filter: (?i).+
- name: 🇭🇰 香港
  type: select
  include-all: true
  filter: (?i)(香港|Hong ?Kong|HK|🇭🇰)
- name: 🇯🇵 日本
  type: select
  include-all: true
  filter: (?i)(日本|Japan|Tokyo|东京|大阪|Osaka|JP|🇯🇵)
- name: 🇸🇬 新加坡
  type: select
  include-all: true
  filter: (?i)(新加坡|Singapore|SG|🇸🇬)
- name: 🇹🇼 台湾
  type: select
  include-all: true
  filter: (?i)(台湾|台灣|Taiwan|TW|🇹🇼|🇨🇳 台湾)
- name: 🇺🇸 美国
  type: select
  include-all: true
  filter: (?i)(美国|美國|United ?States|USA|US|Los ?Angeles|New ?York|San ?Francisco|Seattle|🇺🇸|🇺🇲)
- name: 🇬🇧 英国
  type: select
  include-all: true
  filter: (?i)(英国|英國|United ?Kingdom|UK|London|🇬🇧)
- name: 🇰🇷 韩国
  type: select
  include-all: true
  filter: (?i)(韩国|韓國|Korea|Seoul|KR|🇰🇷)
- name: 🇩🇪 德国
